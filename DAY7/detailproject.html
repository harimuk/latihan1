  <script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const projects = JSON.parse(localStorage.getItem("projects")) || [];
  const detail = document.getElementById("project-detail");

  if (projects[id]) {
    const p = projects[id];
    detail.innerHTML = `
      <h2>${p.title}</h2>
      <small class="text-muted">${p.date}</small>
      <img src="${p.img}" class="img-fluid my-3 rounded" alt="Project Image">
      <div class="mb-3">
        ${p.tech.map(icon => `<i class="${icon} fa-2x me-2"></i>`).join("")}
      </div>
      <p>${p.desc}</p>
    `;
  } else {
    detail.innerHTML = `<p class="text-danger">Project not found!</p>`;
  }
</script>
