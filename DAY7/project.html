  <div class="container my-5">
   <!-- FORM -->
    <form id="projectForm" class="p-4 bg-white rounded shadow-sm mb-5">
      <div class="mb-3">
        <label class="form-label fw-semibold">Project Name</label>
        <input type="text" id="title" class="form-control" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Start Date</label>
          <input type="date" id="startDate" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">End Date</label>
          <input type="date" id="endDate" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea id="desc" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Technologies</label>
        <div class="row">
          <div class="col-6">
            <div class="form-check">
              <input type="checkbox" id="nodejs" class="form-check-input">
              <label for="nodejs" class="form-check-label">Node Js</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check">
              <input type="checkbox" id="nextjs" class="form-check-input">
              <label for="nextjs" class="form-check-label">Next Js</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check">
              <input type="checkbox" id="reactjs" class="form-check-input">
              <label for="reactjs" class="form-check-label">React Js</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check">
              <input type="checkbox" id="ts" class="form-check-input">
              <label for="ts" class="form-check-label">TypeScript</label>
            </div>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Upload Image</label>
        <input type="file" id="img" class="form-control">
      </div>
      <button type="submit" class="btn btn-dark">Submit</button>
    </form>

    <!-- PROJECT LIST -->
    <h3 class="fw-bold mb-3">My Projects</h3>
    <div class="row" id="project-list"></div>
  </div>
 


<script>
  // --- Ambil data project dari localStorage (kalau ada)
  let projects = JSON.parse(localStorage.getItem("projects")) || [];

  const list = document.getElementById("project-list");
  const form = document.getElementById("projectForm");

  // --- Function render (pakai filter + map)
  function renderProjects() {
    // filter: hanya tampilkan project yang punya title (callback function)
    const filteredProjects = projects.filter(p => p.title.trim() !== "");

    // map: ubah setiap project jadi elemen HTML
    const projectCards = filteredProjects.map((p, index) => {
      return `
        <div class="col-md-4 mb-4">
          <div class="card">
            <img src="${p.img}" class="card-img-top" alt="Project Image">
            <div class="card-body">
              <h5 class="card-title">${p.title}</h5>
              <small class="text-muted">${p.date}</small>
              <p class="card-text mt-2">${p.desc}</p>
              <div class="tech-icons mb-3">
                ${p.tech.map(icon => `<i class="${icon}"></i>`).join("")}
              </div>
              <a href="detailproject.html?id=${index}" class="btn btn-dark btn-sm">Detail</a>
            </div>
          </div>
        </div>
      `;
    }).join(""); // ubah array HTML jadi satu string

    // tampilkan hasil map ke halaman
    list.innerHTML = projectCards;
  }

  // --- Function untuk tambah project
  function addProject(title, start, end, desc, img, tech) {
    projects.push({
      title,
      date: `${start} - ${end}`,
      desc,
      img,
      tech
    });
    // callback: simpan lagi ke localStorage
    localStorage.setItem("projects", JSON.stringify(projects));
    renderProjects();
  }

  // --- Event listener saat form disubmit
  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const title = document.getElementById("title").value;
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;
    const desc = document.getElementById("desc").value;
    const imgInput = document.getElementById("img");

    // ambil tech yang dicentang
    const tech = [];
    if (document.getElementById("nodejs").checked) tech.push("fab fa-node-js");
    if (document.getElementById("reactjs").checked) tech.push("fab fa-react");
    if (document.getElementById("ts").checked) tech.push("fab fa-js-square");

    // handle upload gambar (convert ke Base64)
    if (imgInput.files && imgInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        addProject(title, start, end, desc, e.target.result, tech);
      };
      reader.readAsDataURL(imgInput.files[0]);
    } else {
      addProject(title, start, end, desc, "https://via.placeholder.com/300x200", tech);
    }

    form.reset();
  });

  // --- Render awal saat halaman dibuka
  renderProjects();
</script>
